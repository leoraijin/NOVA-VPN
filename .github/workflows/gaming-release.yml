name: Windows build and release
on:
  push:
    branches: [main]
    paths: ['Properties/AssemblyInfo.cs', '.github/workflows/gaming-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified public runtime payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory work,outputs -Force | Out-Null
          $url = 'https://github.com/leoraijin/NOVA-VPN/releases/download/v2.3.36/'
          Invoke-WebRequest ($url + 'NOVA-VPN-Windows-2.3.36-Portable.zip') -OutFile work/runtime.zip
          if ((Get-FileHash work/runtime.zip -Algorithm SHA256).Hash -ne 'F6A4A388EEB00127EBAE7AE68D68584C091BEB332EFB150F581BDA0598BE4FDE') { throw 'Runtime archive SHA-256 mismatch' }
          Expand-Archive work/runtime.zip work/payload
          $sources = @{
            'Reality-Core-source-from-handoff.zip' = '7CFE327A5818958328F007DF9E08104C5D00020E060DC4C7D929B924C6BA0A29'
            'reality-dependencies.tar.gz' = '111E83C27BDE21F5C4796C14C984055CBDC3A95C29D291BE493662B717651BD4'
          }
          foreach ($name in $sources.Keys) {
            Invoke-WebRequest ($url + $name) -OutFile (Join-Path outputs $name)
            if ((Get-FileHash (Join-Path outputs $name) -Algorithm SHA256).Hash -ne $sources[$name]) { throw 'Third-party source SHA-256 mismatch' }
          }
      - name: Build and test
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'MSBuild not found' }
          & $msbuild 'NOVA VPN.csproj' /t:Rebuild /p:Configuration=Release /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          $csc = Join-Path (Split-Path $msbuild) 'Roslyn\csc.exe'
          ./tests/Run-GamingTests.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe' -CorePath 'work/payload/core/sing-box.exe' -WorkPath work/gaming-tests -CscPath $csc
          powershell -NoProfile -STA -File tests/GamingUiTests.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Gaming UI tests failed' }
          powershell -NoProfile -STA -File tests/SmoothScrollIntegrationTests.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Page regression tests failed' }
      - name: Package and verify
        shell: pwsh
        run: |
          ./packaging/Make-Installer.ps1 -AppOutput 'bin/Release/NOVA VPN.exe' -RecoveredPayloadDirectory (Resolve-Path work/payload).Path -OutputDirectory (Join-Path $PWD outputs)
          Copy-Item 'outputs/NOVA VPN Setup 2.4.0.exe' 'outputs/NOVA.VPN.Setup.2.4.0.exe'
          powershell -NoProfile -File tests/InstallerPayloadTests.ps1 -InstallerPath 'outputs/NOVA.VPN.Setup.2.4.0.exe' -AppPath 'bin/Release/NOVA VPN.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Installer validation failed' }
          $setup = [Reflection.Assembly]::LoadFile((Resolve-Path 'outputs/NOVA.VPN.Setup.2.4.0.exe').Path)
          $stream = $setup.GetManifestResourceStream('NOVA.Payload.zip')
          $portable = [IO.File]::Create((Join-Path $PWD 'outputs/NOVA-VPN-Windows-2.4.0-Portable.zip'))
          try { $stream.CopyTo($portable) } finally { $portable.Dispose(); $stream.Dispose() }
          git archive --format=zip --output=outputs/NOVA-VPN-Windows-2.4.0-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Copy-Item docs/GAMING-RELEASE-NOTES.md outputs/RELEASE-NOTES.md
          @"
          Build commit: $env:GITHUB_SHA
          Gaming selection, actual sing-box TCP/UDP/A2S challenge and cancellation fixtures: PASS.
          Gaming UI and existing-page scroll integration: PASS.
          Embedded installer payload matches built EXE: PASS.
          Synthetic loopback fixtures only. Real matches, providers, anti-cheat compatibility and ping improvements are NOT verified.
          Existing sing-box 1.13.14, Reality and Zapret runtime payload reused from checksum-pinned public 2.3.36; no core rebuild.
          "@ | Set-Content outputs/VERIFICATION.txt -Encoding utf8
          Get-ChildItem outputs -File | Where-Object Name -ne SHA256SUMS.txt | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content outputs/SHA256SUMS.txt -Encoding ascii
          # Publish the dot-separated installer name used by the existing updater.
          Move-Item -LiteralPath 'outputs/NOVA VPN Setup 2.4.0.exe' -Destination 'work/NOVA VPN Setup 2.4.0.exe'
          Get-ChildItem outputs -File | Where-Object Name -ne SHA256SUMS.txt | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content outputs/SHA256SUMS.txt -Encoding ascii
      - name: Publish release after all checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.4.0 --repo leoraijin/NOVA-VPN --json id 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create v2.4.0 --repo leoraijin/NOVA-VPN --target "$env:GITHUB_SHA" --draft --prerelease=false --title 'NOVA VPN 2.4.0 — игровой режим' --notes-file docs/GAMING-RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
          }
          foreach ($asset in Get-ChildItem outputs -File) {
            $uploaded = $false
            for ($attempt = 0; $attempt -lt 3; $attempt++) {
              gh release upload v2.4.0 --repo leoraijin/NOVA-VPN --clobber $asset.FullName
              if ($LASTEXITCODE -eq 0) { $uploaded = $true; break }
              Start-Sleep -Seconds 3
            }
            if (!$uploaded) { throw "Asset upload failed: $($asset.Name)" }
          }
          gh release edit v2.4.0 --repo leoraijin/NOVA-VPN --target "$env:GITHUB_SHA" --draft=false --prerelease=false --latest --title 'NOVA VPN 2.4.0 — игровой режим' --notes-file docs/GAMING-RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
