name: Windows build and release
on:
  push:
    branches: [main]
    paths: ['Properties/AssemblyInfo.cs', '.github/workflows/gaming-release.yml', 'tests/SettingsTransferTests.ps1', 'NovaVpn/ReleaseNotesService.cs', 'NovaVpn/PortableConfigService.cs', 'packaging/InstallerUI.cs']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish normal release after all checks (existing releases are never replaced)'
        type: boolean
        default: false
      tun_only:
        description: 'Run the Wintun fixture quickly with the pinned stable binaries'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ inputs.tun_only && 'windows-wintun-fixture' || 'windows-release' }}
  cancel-in-progress: true
jobs:
  verify-tun:
    if: github.event_name == 'workflow_dispatch' && inputs.tun_only
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: leoraijin/vpn-core
          ref: ac6f365a1b620155e4d6f4176d58e8b0aac03d7a
          path: work/wintun-test-fixture
          persist-credentials: false
      - name: Verify Windows TUN with the pinned stable cores
        shell: pwsh
        run: |
          $archive = 'work/stable-windows-runtime.zip'
          Invoke-WebRequest 'https://github.com/leoraijin/NOVA-VPN/releases/download/v2.6.20/NOVA-VPN-Windows-2.6.20-Portable.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive).Hash -ne 'CF780E97F3FA35CD574F4B70A230018E0C7CFCB05ABDB30EADD2C5FD636783C9') { throw 'Pinned runtime hash mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath work/stable-runtime
          python tests/Run-ExitMatrix.py --windows-tun --fixture work/wintun-test-fixture/scripts/test_dual_exit_loopback.py --sing-box work/stable-runtime/core/sing-box.exe --reality work/stable-runtime/core/reality-client.exe --workdir work/test-exit-matrix
          if ($LASTEXITCODE -ne 0) { throw 'Wintun exit matrix failed' }
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.tun_only
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified public runtime payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory work,outputs -Force | Out-Null
          $url = 'https://github.com/leoraijin/NOVA-VPN/releases/download/v2.6.15/'
          Invoke-WebRequest ($url + 'NOVA-VPN-Windows-2.6.15-Portable.zip') -OutFile work/runtime.zip
          if ((Get-FileHash work/runtime.zip -Algorithm SHA256).Hash -ne 'DE568E682D77E166C1615EF362ED6E66CF107783E544FE746CF1C719435A4D57') { throw 'Runtime archive SHA-256 mismatch' }
          Expand-Archive work/runtime.zip work/payload
      - uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: 25a600db24f7680ad9806ce5427bd0ab8afe1114
          path: work/sing-box
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: work/sing-box/go.sum
      - name: Build patched sing-box and archive its sources
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOAMD64: v1
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: |
          $patch = (Resolve-Path -LiteralPath 'packaging/core-patches/sing-box-dns-latency.patch').Path
          git -C work/sing-box apply --index $patch
          if ($LASTEXITCODE) { throw 'sing-box DNS patch does not match the pinned source' }
          Push-Location work/sing-box
          try {
            $tags = 'with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_naive_outbound,with_purego,badlinkname,tfogo_checklinkname0'
            $flags = '-X internal/godebug.defaultGODEBUG=multipathtcp=0 -checklinkname=0'
            go test -mod=readonly -tags $tags -ldflags $flags ./dns
            if ($LASTEXITCODE) { throw 'sing-box DNS regression failed' }
            go build -buildvcs=false -mod=readonly -trimpath -tags $tags -ldflags "$flags -s -w -X github.com/sagernet/sing-box/constant.Version=1.13.14-nova-dns.1" -o ../payload/core/sing-box.exe ./cmd/sing-box
            if ($LASTEXITCODE) { throw 'sing-box build failed' }
            Copy-Item -LiteralPath LICENSE -Destination ../payload/core/LICENSE-sing-box.txt -Force
            $tree = git write-tree
            if ($LASTEXITCODE) { throw 'Cannot identify the patched sing-box source' }
            git archive --format=zip --output=../../outputs/sing-box-source.zip $tree
            if ($LASTEXITCODE) { throw 'sing-box source archive failed' }
            go mod vendor -o ../sing-box-dependencies
            if ($LASTEXITCODE) { throw 'sing-box dependency source export failed' }
            tar -czf ../../outputs/sing-box-dependencies.tar.gz -C .. sing-box-dependencies
            if ($LASTEXITCODE) { throw 'sing-box dependency source archive failed' }
          } finally { Pop-Location }
      - uses: actions/checkout@v4
        with:
          repository: leoraijin/vpn-core
          ref: 5feb9360aada4f7818eb50ae14e5a8846a4c14bc
          path: work/reality-core
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b
      - name: Build pinned Reality Core and archive its sources
        shell: pwsh
        run: |
          $revision = git -C work/reality-core rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or !(Select-String -LiteralPath NovaVpn/VpnEngine.cs -SimpleMatch ('"' + $revision + '"') -Quiet)) { throw 'Reality source revision mismatch' }
          $patch = (Resolve-Path -LiteralPath 'packaging/core-patches/reality-media-latency.patch').Path
          git -C work/reality-core apply --index $patch
          if ($LASTEXITCODE) { throw 'Reality DNS and QUIC patch does not match the pinned source' }
          Push-Location work/reality-core
          try {
            cargo test --locked -p reality-core --lib --test app_dns
            if ($LASTEXITCODE) { throw 'Reality Core DNS and QUIC regressions failed' }
            cargo build --locked --release -p reality-client
            if ($LASTEXITCODE -ne 0) { throw 'Reality Core build failed' }
            Copy-Item target/release/reality-client.exe ../payload/core/reality-client.exe -Force
            Copy-Item LICENSE ../payload/core/LICENSE-reality-core.txt -Force
            cargo install cargo-about --locked --version 0.9.2 --features cli
            if ($LASTEXITCODE -ne 0) { throw 'Reality Core license tool installation failed' }
            cargo about generate --locked --manifest-path bin/client/Cargo.toml --output-file ../payload/core/THIRD-PARTY-LICENSES.html scripts/about/third-party-licenses.hbs
            if ($LASTEXITCODE -ne 0) { throw 'Reality Core notices generation failed' }
            $tree = git write-tree
            if ($LASTEXITCODE) { throw 'Cannot identify the patched Reality source' }
            git archive --format=zip --output=../../outputs/Reality-Core-source.zip $tree
            if ($LASTEXITCODE -ne 0) { throw 'Reality Core source archive failed' }
            cargo vendor --locked ../reality-dependencies | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Reality Core dependency source export failed' }
            tar -czf ../../outputs/reality-dependencies.tar.gz -C .. reality-dependencies
            if ($LASTEXITCODE -ne 0) { throw 'Reality Core dependency source archive failed' }
          } finally { Pop-Location }
      - name: Build and test
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'MSBuild not found' }
          ./scripts/Build-Review.ps1 -Release -CompilerPath (Join-Path (Split-Path $msbuild) 'Roslyn\csc.exe') -OutputPath (Join-Path $PWD 'bin/Release')
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          $csc = Join-Path (Split-Path $msbuild) 'Roslyn\csc.exe'
          ./tests/Run-GamingTests.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe' -CorePath 'work/payload/core/sing-box.exe' -WorkPath (Join-Path $PWD work/gaming-tests) -CscPath $csc
          ./tests/Run-GameLibraryTests.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe' -CorePath 'work/payload/core/sing-box.exe' -WorkPath (Join-Path $PWD work/game-library-tests) -CscPath $csc
          powershell -NoProfile -STA -File tests/DesktopControlsUiTests.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe' -WorkPath 'work/desktop-ui'
          if ($LASTEXITCODE -ne 0) { throw 'Desktop UI tests failed' }
          powershell -NoProfile -STA -File tests/SmoothScrollIntegrationTests.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Page regression tests failed' }
      - name: Verify routing entry cells
        shell: pwsh
        run: |
          powershell -NoProfile -STA -File tests/RoutingEntryUiTests.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe' -WorkPath 'work/routing-entry-ui'
          if ($LASTEXITCODE -ne 0) { throw 'Routing entry UI checks failed' }
      - name: Verify routing cards and retained rules
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          $csc = Join-Path (Split-Path $msbuild) 'Roslyn\csc.exe'
          ./scripts/Run-MultiServerRegressionChecks.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe' -CompilerPath $csc -Cases @('MultiVpnSlotsTests','MultiExitHealthDisplayTests','RoutingCardsTests','MultiServerSettingsTests','MultiServerConfigTests','MultiServerEditorTests','MultiServerRoutingHistoryTests','RoutingApplyTransactionTests')
          & 'work/payload/core/sing-box.exe' check -c 'bin/Release/RoutingCardsTests/synthetic-config.json'
          if ($LASTEXITCODE -ne 0) { throw 'Routing-card native core check failed' }
          & 'work/payload/core/reality-client.exe' --check -c 'bin/Release/MultiServerConfigTests/reality-dual-config.json'
          if ($LASTEXITCODE -ne 0) { throw 'Reality Core rejected the Windows dual configuration' }
          & 'work/payload/core/sing-box.exe' check -c 'bin/Release/MultiVpnSlotsTests/ten-config.json'
          if ($LASTEXITCODE -ne 0) { throw 'sing-box rejected the ten-exit configuration' }
          & 'work/payload/core/reality-client.exe' --check -c 'bin/Release/MultiVpnSlotsTests/reality-ten-config.json'
          if ($LASTEXITCODE -ne 0) { throw 'Reality Core rejected the ten-exit configuration' }
      - uses: actions/checkout@v4
        with:
          repository: leoraijin/vpn-core
          ref: ac6f365a1b620155e4d6f4176d58e8b0aac03d7a
          path: work/wintun-test-fixture
          persist-credentials: false
      - name: Verify loopback TCP with 1, 2 and 10 VPN exits
        shell: pwsh
        run: |
          python tests/Run-ExitMatrix.py --fixture work/wintun-test-fixture/scripts/test_dual_exit_loopback.py --sing-box work/payload/core/sing-box.exe --reality work/payload/core/reality-client.exe --workdir work/test-exit-matrix
          if ($LASTEXITCODE -ne 0) { throw 'Loopback route matrix failed' }
      - name: Verify actual Wintun routing on the disposable runner
        shell: pwsh
        run: |
          python work/wintun-test-fixture/scripts/test_dual_exit_loopback.py work/payload/core/reality-client.exe --windows-tun
          if ($LASTEXITCODE -ne 0) { throw 'Wintun route verification failed' }
          python tests/Run-ExitMatrix.py --windows-tun --fixture work/wintun-test-fixture/scripts/test_dual_exit_loopback.py --sing-box work/payload/core/sing-box.exe --reality work/payload/core/reality-client.exe --workdir work/test-exit-matrix
          if ($LASTEXITCODE -ne 0) { throw 'Wintun exit matrix failed' }
      - name: Verify settings transfer
        shell: pwsh
        run: |
          powershell -NoProfile -STA -File tests/SettingsTransferTests.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Settings transfer regression failed' }
      - name: Verify map background activity
        shell: pwsh
        run: |
          powershell -NoProfile -STA -File tests/AppUpdateAndPerformanceTests.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Map background activity regression failed' }
          powershell -NoProfile -STA -File tests/ServerConfigTransferTests.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe' -WorkPath 'work/server-config-transfer-tests'
          if ($LASTEXITCODE -ne 0) { throw 'Server config transfer tests failed' }
          powershell -NoProfile -STA -File tests/HomeConfigTransferLayoutTests.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Home config transfer layout tests failed' }
          powershell -NoProfile -STA -File tests/InteractiveMapTests.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe' -CorePath 'work/payload/core/sing-box.exe' -WorkPath 'work/interactive-map-tests'
          if ($LASTEXITCODE -ne 0) { throw 'Interactive map and HTTPS probe regression failed' }
      - name: Package and verify
        shell: pwsh
        run: |
          $version = ([Version](Get-Item -LiteralPath 'bin/Release/NOVA VPN.exe').VersionInfo.FileVersion).ToString(3)
          ./packaging/Make-Installer.ps1 -AppOutput 'bin/Release/NOVA VPN.exe' -RecoveredPayloadDirectory (Resolve-Path work/payload).Path -OutputDirectory (Join-Path $PWD outputs)
          Copy-Item "outputs/NOVA VPN Setup $version.exe" "outputs/NOVA.VPN.Setup.$version.exe"
          powershell -NoProfile -File tests/InstallerPayloadTests.ps1 -InstallerPath "outputs/NOVA.VPN.Setup.$version.exe" -AppPath 'bin/Release/NOVA VPN.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Installer validation failed' }
          powershell -NoProfile -File tests/InstallerLockTests.ps1 -InstallerPath "outputs/NOVA.VPN.Setup.$version.exe" -WorkPath 'work/installer-lock-tests'
          if ($LASTEXITCODE -ne 0) { throw 'Installer lock regression failed' }
          $setup = [Reflection.Assembly]::LoadFile((Resolve-Path "outputs/NOVA.VPN.Setup.$version.exe").Path)
          $stream = $setup.GetManifestResourceStream('NOVA.Payload.zip')
          $portable = [IO.File]::Create((Join-Path $PWD "outputs/NOVA-VPN-Windows-$version-Portable.zip"))
          try { $stream.CopyTo($portable) } finally { $portable.Dispose(); $stream.Dispose() }
          New-Item -ItemType Directory work/complete -Force | Out-Null
          Expand-Archive -LiteralPath "outputs/NOVA-VPN-Windows-$version-Portable.zip" -DestinationPath work/complete
          Copy-Item -LiteralPath "outputs/NOVA.VPN.Setup.$version.exe" -Destination work/complete
          $complete = "outputs/NOVA-VPN-Windows-$version-Complete.zip"
          Compress-Archive -Path 'work/complete/*' -DestinationPath $complete
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $complete).Path)
          try {
            foreach ($entry in @("NOVA.VPN.Setup.$version.exe", 'NOVA VPN.exe', 'core/reality-client.exe', 'core/sing-box.exe', 'core/wintun.dll')) {
              if (!$archive.GetEntry($entry) -and !$archive.GetEntry($entry.Replace('/', ''))) { throw "Complete archive is missing $entry" }
            }
          } finally { $archive.Dispose() }
          '{0}  {1}' -f (Get-FileHash -LiteralPath $complete).Hash.ToLowerInvariant(), (Split-Path $complete -Leaf) |
            Set-Content "$complete.sha256" -Encoding ascii
          git archive --format=zip --output="outputs/NOVA-VPN-Windows-$version-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          $notes = "docs/WINDOWS-$version-RELEASE-NOTES.md"
          if (!(Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
          Copy-Item -LiteralPath $notes -Destination outputs/RELEASE-NOTES.md
          @"
          Build commit: $env:GITHUB_SHA
          Routing entry UI: eight lists, independent edits, add/delete, multiline paste, Zapret locks, light/dark and narrow layout checks: PASS.
          Desktop UI, legacy recovery, scroll and installer regressions above: PASS.
          Built patched Reality Core and sing-box from pinned revisions. DNS latency tests passed for both cores, plus the Reality Core first-datagram regression. The remaining runtime payload was restored from checksum-pinned 2.6.15.
          Windows Wintun on a disposable runner: TCP, UDP and DNS packets through 1, 2 and 10 exits on both cores: PASS.
          Windows map background activity and cancellation regression: PASS.
          Network scenarios used isolated test servers.
          "@ | Set-Content outputs/VERIFICATION.txt -Encoding utf8
          Get-ChildItem outputs -File | Where-Object Name -ne SHA256SUMS.txt | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content outputs/SHA256SUMS.txt -Encoding ascii
          # Publish the dot-separated installer name used by the existing updater.
          Move-Item -LiteralPath "outputs/NOVA VPN Setup $version.exe" -Destination "work/NOVA VPN Setup $version.exe"
          Get-ChildItem outputs -File | Where-Object Name -ne SHA256SUMS.txt | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content outputs/SHA256SUMS.txt -Encoding ascii
      - name: Verify installed files and upgrade from the stable Windows release
        shell: pwsh
        run: |
          $baseline = 'work/NOVA.VPN.Setup.2.6.22.exe'
          Invoke-WebRequest 'https://github.com/leoraijin/NOVA-VPN/releases/download/v2.6.22/NOVA.VPN.Setup.2.6.22.exe' -OutFile $baseline
          if ((Get-FileHash -LiteralPath $baseline).Hash -ne '13C11C974235417E574D8021A65C6BA22F7B4A403AE672881C895203D703632A') { throw 'Baseline installer SHA-256 mismatch' }
          $version = ([Version](Get-Item -LiteralPath 'bin/Release/NOVA VPN.exe').VersionInfo.FileVersion).ToString(3)
          powershell -NoProfile -STA -File tests/InstallerUpgradeIntegration.ps1 -BaselineInstaller $baseline -CandidateInstaller "work/complete/NOVA.VPN.Setup.$version.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installer upgrade integration failed' }
      - name: Save verified packages
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-VPN-Windows-verified
          path: outputs/*
          retention-days: 14
          if-no-files-found: error
  verify-clean-install:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NOVA-VPN-Windows-verified
          path: outputs
      - name: Verify clean install from the complete archive
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem outputs -File -Filter 'NOVA-VPN-Windows-*-Complete.zip')
          if ($archives.Count -ne 1) { throw 'Expected one complete Windows archive' }
          $archive = $archives[0]
          $expected = ((Get-Content -LiteralPath ($archive.FullName + '.sha256') -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $archive.FullName).Hash -ne $expected) { throw 'Complete archive SHA-256 mismatch' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath extracted
          $installers = @(Get-ChildItem extracted -File -Filter 'NOVA.VPN.Setup.*.exe')
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer in the complete archive' }
          powershell -NoProfile -STA -File tests/InstallerUpgradeIntegration.ps1 -CleanInstallOnly -CandidateInstaller $installers[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Candidate clean install failed' }
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [build, verify-clean-install]
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NOVA-VPN-Windows-verified
          path: outputs
      - name: Publish release after all checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installers = @(Get-ChildItem outputs -File -Filter 'NOVA.VPN.Setup.*.exe')
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer in the verified artifact' }
          $version = ([Version]$installers[0].VersionInfo.FileVersion).ToString(3)
          $tag = "v$version"
          gh release view $tag --repo leoraijin/NOVA-VPN --json id 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already exists'; exit 0 }
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo leoraijin/NOVA-VPN --target "$env:GITHUB_SHA" --draft --prerelease=false --title "NOVA VPN $version — Windows" --notes-file outputs/RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
          }
          foreach ($asset in Get-ChildItem outputs -File) {
            $uploaded = $false
            for ($attempt = 0; $attempt -lt 3; $attempt++) {
              gh release upload $tag --repo leoraijin/NOVA-VPN $asset.FullName
              if ($LASTEXITCODE -eq 0) { $uploaded = $true; break }
              Start-Sleep -Seconds 3
            }
            if (!$uploaded) { throw "Asset upload failed: $($asset.Name)" }
          }
          gh release edit $tag --repo leoraijin/NOVA-VPN --target "$env:GITHUB_SHA" --draft=false --prerelease=false --latest --title "NOVA VPN $version — Windows" --notes-file outputs/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
