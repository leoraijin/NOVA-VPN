name: Windows build and release
on:
  push:
    branches: [main]
    paths: ['Properties/AssemblyInfo.cs', '.github/workflows/gaming-release.yml', 'tests/SettingsTransferTests.ps1', 'NovaVpn/ReleaseNotesService.cs', 'NovaVpn/PortableConfigService.cs', 'packaging/InstallerUI.cs']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish normal release after all checks (existing releases are never replaced)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified public runtime payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory work,outputs -Force | Out-Null
          $url = 'https://github.com/leoraijin/NOVA-VPN/releases/download/v2.6.15/'
          Invoke-WebRequest ($url + 'NOVA-VPN-Windows-2.6.15-Portable.zip') -OutFile work/runtime.zip
          if ((Get-FileHash work/runtime.zip -Algorithm SHA256).Hash -ne 'DE568E682D77E166C1615EF362ED6E66CF107783E544FE746CF1C719435A4D57') { throw 'Runtime archive SHA-256 mismatch' }
          Expand-Archive work/runtime.zip work/payload
      - uses: actions/checkout@v4
        with:
          repository: leoraijin/vpn-core
          ref: 16fe5dd518652965fe2c469dc943054fb86f4b9c
          path: work/reality-core
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b
      - name: Build pinned Reality Core and archive its sources
        shell: pwsh
        run: |
          $revision = git -C work/reality-core rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or !(Select-String -LiteralPath NovaVpn/VpnEngine.cs -SimpleMatch ('"' + $revision + '"') -Quiet)) { throw 'Reality source revision mismatch' }
          Push-Location work/reality-core
          try {
            cargo build --locked --release -p reality-client
            if ($LASTEXITCODE -ne 0) { throw 'Reality Core build failed' }
            Copy-Item target/release/reality-client.exe ../payload/core/reality-client.exe -Force
            Copy-Item LICENSE ../payload/core/LICENSE-reality-core.txt -Force
            git archive --format=zip --output=../../outputs/Reality-Core-source.zip HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Reality Core source archive failed' }
            cargo vendor --locked ../reality-dependencies | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Reality Core dependency source export failed' }
            tar -czf ../../outputs/reality-dependencies.tar.gz -C .. reality-dependencies
            if ($LASTEXITCODE -ne 0) { throw 'Reality Core dependency source archive failed' }
          } finally { Pop-Location }
      - name: Build and test
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'MSBuild not found' }
          ./scripts/Build-Review.ps1 -Release -CompilerPath (Join-Path (Split-Path $msbuild) 'Roslyn\csc.exe') -OutputPath (Join-Path $PWD 'bin/Release')
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          $csc = Join-Path (Split-Path $msbuild) 'Roslyn\csc.exe'
          ./tests/Run-GamingTests.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe' -CorePath 'work/payload/core/sing-box.exe' -WorkPath (Join-Path $PWD work/gaming-tests) -CscPath $csc
          ./tests/Run-GameLibraryTests.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe' -CorePath 'work/payload/core/sing-box.exe' -WorkPath (Join-Path $PWD work/game-library-tests) -CscPath $csc
          powershell -NoProfile -STA -File tests/DesktopControlsUiTests.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe' -WorkPath 'work/desktop-ui'
          if ($LASTEXITCODE -ne 0) { throw 'Desktop UI tests failed' }
          powershell -NoProfile -STA -File tests/SmoothScrollIntegrationTests.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Page regression tests failed' }
      - name: Verify routing entry cells
        shell: pwsh
        run: |
          powershell -NoProfile -STA -File tests/RoutingEntryUiTests.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe' -WorkPath 'work/routing-entry-ui'
          if ($LASTEXITCODE -ne 0) { throw 'Routing entry UI checks failed' }
      - name: Verify routing cards and retained rules
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          $csc = Join-Path (Split-Path $msbuild) 'Roslyn\csc.exe'
          ./scripts/Run-MultiServerRegressionChecks.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe' -CompilerPath $csc -Cases @('MultiExitHealthDisplayTests','RoutingCardsTests','MultiServerSettingsTests','MultiServerConfigTests','MultiServerEditorTests','MultiServerRoutingHistoryTests','RoutingApplyTransactionTests')
          & 'work/payload/core/sing-box.exe' check -c 'bin/Release/RoutingCardsTests/synthetic-config.json'
          if ($LASTEXITCODE -ne 0) { throw 'Routing-card native core check failed' }
          & 'work/payload/core/reality-client.exe' --check -c 'bin/Release/MultiServerConfigTests/reality-dual-config.json'
          if ($LASTEXITCODE -ne 0) { throw 'Reality Core rejected the Windows dual configuration' }
      - name: Verify settings transfer
        shell: pwsh
        run: |
          powershell -NoProfile -STA -File tests/SettingsTransferTests.ps1 -AssemblyPath 'bin/Release/NOVA VPN.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Settings transfer regression failed' }
      - name: Package and verify
        shell: pwsh
        run: |
          $version = ([Version](Get-Item -LiteralPath 'bin/Release/NOVA VPN.exe').VersionInfo.FileVersion).ToString(3)
          ./packaging/Make-Installer.ps1 -AppOutput 'bin/Release/NOVA VPN.exe' -RecoveredPayloadDirectory (Resolve-Path work/payload).Path -OutputDirectory (Join-Path $PWD outputs)
          Copy-Item "outputs/NOVA VPN Setup $version.exe" "outputs/NOVA.VPN.Setup.$version.exe"
          powershell -NoProfile -File tests/InstallerPayloadTests.ps1 -InstallerPath "outputs/NOVA.VPN.Setup.$version.exe" -AppPath 'bin/Release/NOVA VPN.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Installer validation failed' }
          powershell -NoProfile -File tests/InstallerLockTests.ps1 -InstallerPath "outputs/NOVA.VPN.Setup.$version.exe" -WorkPath 'work/installer-lock-tests'
          if ($LASTEXITCODE -ne 0) { throw 'Installer lock regression failed' }
          $setup = [Reflection.Assembly]::LoadFile((Resolve-Path "outputs/NOVA.VPN.Setup.$version.exe").Path)
          $stream = $setup.GetManifestResourceStream('NOVA.Payload.zip')
          $portable = [IO.File]::Create((Join-Path $PWD "outputs/NOVA-VPN-Windows-$version-Portable.zip"))
          try { $stream.CopyTo($portable) } finally { $portable.Dispose(); $stream.Dispose() }
          New-Item -ItemType Directory work/complete -Force | Out-Null
          Expand-Archive -LiteralPath "outputs/NOVA-VPN-Windows-$version-Portable.zip" -DestinationPath work/complete
          Copy-Item -LiteralPath "outputs/NOVA.VPN.Setup.$version.exe" -Destination work/complete
          $complete = "outputs/NOVA-VPN-Windows-$version-Complete.zip"
          Compress-Archive -Path 'work/complete/*' -DestinationPath $complete
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $complete).Path)
          try {
            foreach ($entry in @("NOVA.VPN.Setup.$version.exe", 'NOVA VPN.exe', 'core/reality-client.exe', 'core/sing-box.exe', 'core/wintun.dll')) {
              if (!$archive.GetEntry($entry) -and !$archive.GetEntry($entry.Replace('/', ''))) { throw "Complete archive is missing $entry" }
            }
          } finally { $archive.Dispose() }
          '{0}  {1}' -f (Get-FileHash -LiteralPath $complete).Hash.ToLowerInvariant(), (Split-Path $complete -Leaf) |
            Set-Content "$complete.sha256" -Encoding ascii
          git archive --format=zip --output="outputs/NOVA-VPN-Windows-$version-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          $notes = "docs/WINDOWS-$version-RELEASE-NOTES.md"
          if (!(Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
          Copy-Item -LiteralPath $notes -Destination outputs/RELEASE-NOTES.md
          @"
          Build commit: $env:GITHUB_SHA
          Routing entry UI: eight lists, independent edits, add/delete, multiline paste, Zapret locks, light/dark and narrow layout checks: PASS.
          Desktop UI, legacy recovery, scroll and installer regressions above: PASS.
          Reality Core compiled from the revision pinned in VpnEngine.cs. Remaining runtime payload restored from checksum-pinned 2.6.15.
          Real provider connectivity was not tested for this UI update.
          "@ | Set-Content outputs/VERIFICATION.txt -Encoding utf8
          Get-ChildItem outputs -File | Where-Object Name -ne SHA256SUMS.txt | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content outputs/SHA256SUMS.txt -Encoding ascii
          # Publish the dot-separated installer name used by the existing updater.
          Move-Item -LiteralPath "outputs/NOVA VPN Setup $version.exe" -Destination "work/NOVA VPN Setup $version.exe"
          Get-ChildItem outputs -File | Where-Object Name -ne SHA256SUMS.txt | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content outputs/SHA256SUMS.txt -Encoding ascii
      - name: Save verified packages
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-VPN-Windows-verified
          path: outputs/*
          retention-days: 14
          if-no-files-found: error
      - name: Publish release after all checks
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([Version](Get-Item -LiteralPath 'bin/Release/NOVA VPN.exe').VersionInfo.FileVersion).ToString(3)
          $tag = "v$version"
          gh release view $tag --repo leoraijin/NOVA-VPN --json id 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already exists'; exit 0 }
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo leoraijin/NOVA-VPN --target "$env:GITHUB_SHA" --draft --prerelease=false --title "NOVA VPN $version — Windows" --notes-file outputs/RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
          }
          foreach ($asset in Get-ChildItem outputs -File) {
            $uploaded = $false
            for ($attempt = 0; $attempt -lt 3; $attempt++) {
              gh release upload $tag --repo leoraijin/NOVA-VPN $asset.FullName
              if ($LASTEXITCODE -eq 0) { $uploaded = $true; break }
              Start-Sleep -Seconds 3
            }
            if (!$uploaded) { throw "Asset upload failed: $($asset.Name)" }
          }
          gh release edit $tag --repo leoraijin/NOVA-VPN --target "$env:GITHUB_SHA" --draft=false --prerelease=false --latest --title "NOVA VPN $version — Windows" --notes-file outputs/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
